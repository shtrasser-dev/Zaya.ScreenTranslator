name: Publish

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Release notes (shown on GitHub Releases; optional)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: windows-2022
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build host
        run: .\build.cmd

      - name: Upload host artifact
        uses: actions/upload-artifact@v4
        with:
          name: host
          path: |
            out/Zaya.ScreenTranslator.zip
            out/version.txt
            out/channel.txt
          retention-days: 7

  create-release:
    needs: build
    if: contains(github.server_url, 'github.com')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: host
          path: host

      - uses: actions/github-script@v7
        env:
          RELEASE_CHANGELOG: ${{ inputs.changelog }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const version = fs.readFileSync('host/version.txt', 'utf8').trim();
            const channel = fs.readFileSync('host/channel.txt', 'utf8').trim();
            const zipName = 'Zaya.ScreenTranslator.zip';
            const zipPath = path.join('host', zipName);
            if (!fs.existsSync(zipPath)) {
              core.setFailed(`Missing ${zipName}`);
              return;
            }

            const tag = `app-v${version}`;
            const latestTag = `app-v${channel}-latest`;
            const releaseName = `Zaya.ScreenTranslator v${version}`;
            const changelog = (process.env.RELEASE_CHANGELOG || '').trim();
            const meta = [
              `version: ${version}`,
              `primitivesChannel: ${channel}`,
              '',
              `Zaya.ScreenTranslator v${version} (Primitives channel ${channel}).`,
              '',
              'Download `Zaya.ScreenTranslator.zip`, extract, and run `Zaya.ScreenTranslator.exe`.',
              '',
              'Host does not self-update: open this release page from the app when a newer version is available.',
            ].join('\n');
            const body = changelog ? `${changelog}\n\n---\n\n${meta}` : meta;

            async function createOrReplaceRelease(tagName, name, releaseBody, makeLatest) {
              try {
                const existing = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: tagName,
                });
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: existing.data.id,
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }

              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${tagName}`,
                });
              } catch (e) {
                if (e.status !== 404 && e.status !== 422) throw e;
              }

              const release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name,
                body: releaseBody,
                make_latest: makeLatest ? 'true' : 'false',
                generate_release_notes: false,
              });

              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: zipName,
                data: fs.readFileSync(zipPath),
              });
            }

            await createOrReplaceRelease(tag, releaseName, body, true);
            await createOrReplaceRelease(latestTag, releaseName, body, false);
