name: Publish

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet publish src\Zaya.ScreenTranslator.Impl.Windows -c Release -o out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-translator
          path: out/Zaya.ScreenTranslator.Impl.Windows.exe
          retention-days: 7
