name: Publish

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Checkout sibling packages (project references)
        shell: bash
        run: |
          # Shared uses ProjectReference to local siblings when present in CI workspace.
          # Prefer NuGet when siblings are unavailable — restore ProjectRefs via sparse checkouts.
          mkdir -p ../Zaya.OCR/src ../Zaya.Screenshot/src ../Zaya.Translator/src
          git clone --depth 1 https://github.com/shtrasser-dev/Zaya.OCR.git ../Zaya.OCR-tmp
          git clone --depth 1 https://github.com/shtrasser-dev/Zaya.Screenshot.git ../Zaya.Screenshot-tmp
          git clone --depth 1 https://github.com/shtrasser-dev/Zaya.Translator.git ../Zaya.Translator-tmp
          rm -rf ../Zaya.OCR && mv ../Zaya.OCR-tmp ../Zaya.OCR
          rm -rf ../Zaya.Screenshot && mv ../Zaya.Screenshot-tmp ../Zaya.Screenshot
          rm -rf ../Zaya.Translator && mv ../Zaya.Translator-tmp ../Zaya.Translator

      - name: Build host
        run: .\build.cmd

      - name: Upload host artifact
        uses: actions/upload-artifact@v4
        with:
          name: host
          path: |
            out/Zaya.ScreenTranslator.Impl.Windows.exe
            out/version.txt
            out/channel.txt
          retention-days: 7

  create-release:
    needs: build
    if: contains(github.server_url, 'github.com')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: host
          path: host

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const version = fs.readFileSync('host/version.txt', 'utf8').trim();
            const channel = fs.readFileSync('host/channel.txt', 'utf8').trim();
            const exeName = 'Zaya.ScreenTranslator.Impl.Windows.exe';
            const exePath = path.join('host', exeName);
            if (!fs.existsSync(exePath)) {
              core.setFailed(`Missing ${exeName}`);
              return;
            }

            const tag = `app-v${version}`;
            const latestTag = `app-v${channel}-latest`;
            const releaseName = `App v${version}`;
            const body = [
              `version: ${version}`,
              `primitivesChannel: ${channel}`,
              '',
              `ScreenTranslator host v${version} (Primitives channel ${channel}).`,
              '',
              'Host does not self-update: open this release page from the app when a newer version is available.',
            ].join('\n');

            async function createOrReplaceRelease(tagName, name, releaseBody, makeLatest) {
              try {
                const existing = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: tagName,
                });
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: existing.data.id,
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }

              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${tagName}`,
                });
              } catch (e) {
                if (e.status !== 404 && e.status !== 422) throw e;
              }

              const release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name,
                body: releaseBody,
                make_latest: makeLatest ? 'true' : 'false',
                generate_release_notes: tagName === tag,
              });

              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: exeName,
                data: fs.readFileSync(exePath),
              });
            }

            await createOrReplaceRelease(tag, releaseName, body, true);
            await createOrReplaceRelease(latestTag, releaseName, body, false);
